name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests (synthetic; no modem access)
        run: python -m unittest discover -s tests -q
      - name: Compile integration
        run: python -m compileall -q custom_components scripts
      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check .
